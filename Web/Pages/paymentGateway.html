<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Pasarela de Pago</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Style/global.css">
    <link rel="stylesheet" href="../Style/Pages_style/paymentGateway.css">
    <link rel="stylesheet" href="../Style/Template_style/footer.css">
    <link rel="stylesheet" href="../Style/responsive.css">

</head>
<body>

<main class="container">
    <section class="card">

        <div class="contact-header">
            <h1 class="contact-title">Lorem Ipsum</h1>
        </div>

        <form class="contact-form" id="payment-form" novalidate>

            <div class="form-group1">
                <label class="form-label" for="name">Lorem Ipsum</label>
                <input class="form-input form-control" id="name" type="text" required>
            </div>

            <div class="form-group1">
                <label class="form-label" for="surname">Lorem Ipsum</label>
                <input class="form-input form-control" id="surname" type="text" required>
            </div>

            <div class="form-group2">
                <label class="form-label" for="email">Lorem Ipsum</label>
                <input class="form-input form-control" id="email" type="email" required>
            </div>

            <div class="form-group3">
                <label class="form-label" for="phone">Lorem Ipsum</label>
                <input class="form-input form-control" id="phone" type="tel" required pattern="[0-9]{9}" maxlength="9" inputmode="numeric">
            </div>

            <div class="form-group3">
                <label class="form-label" for="message">Lorem Ipsum</label>
                <input class="form-input form-control" id="message" type="text" required>
            </div>

        </form>

        <div class="bottom-action">
            <button class="btn btn-pink" type="submit" form="payment-form">Lorem Ipsum</button>
        </div>

    </section>
</main>

<div id="footer-placeholder" data-include="../Template/footer.html"></div>

<script type="module" src="../Scripts/site.js" defer></script>
<script type="module" src="../Scripts/paymentGateway.js"></script>
</body>
</html>
